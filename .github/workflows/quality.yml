name: YanQiu collector quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install collector
        run: python -m pip install .
      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -v
